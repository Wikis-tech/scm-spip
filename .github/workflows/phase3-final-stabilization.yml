name: Phase 3 Final Stabilization

on:
  push:
    branches: [phase-3-final-stabilization]

permissions:
  contents: write

jobs:
  stabilize-and-validate:
    if: "!contains(github.event.head_commit.message, '[phase3-final]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-3-final-stabilization
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply final server routing fix
        run: node scripts/phase3-final-server-fix.mjs
      - name: Prepare dependency graph
        run: npm install --package-lock-only --ignore-scripts
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Phase 3 security assertions
        run: |
          set -e
          if grep -R -n --exclude-dir=node_modules --exclude='*.md' "scmcapital2026" src server.ts api 2>/dev/null; then echo "Legacy default password remains"; exit 1; fi
          if grep -R -n --exclude-dir=node_modules --exclude='*.md' "KpuBuIUPuGIKOatjdoiVeA" src server.ts api 2>/dev/null; then echo "Committed Apollo fallback remains"; exit 1; fi
          if grep -R -n --exclude-dir=node_modules --exclude='*.md' "VITE_APOLLO_API_KEY" src server.ts api 2>/dev/null; then echo "Apollo client-side secret exposure remains"; exit 1; fi
          if grep -R -n --exclude-dir=node_modules --exclude='*.md' "x-user-role\|x-user-id\|x-user-email" src 2>/dev/null; then echo "Legacy browser-controlled identity headers remain"; exit 1; fi
          if grep -q "auth.admin.createUser" src/server/publicAuthRoutes.ts; then echo "Unsafe public service-role signup remains"; exit 1; fi
          grep -q "supabase.auth.signUp" src/components/AuthScreen.tsx
          grep -q "password.length < 12" src/components/AuthScreen.tsx
          grep -q "mixed_companies/search" src/services/apolloService.ts
          grep -q "mixed_people/api_search" src/services/apolloService.ts
          grep -q "databaseIndependentPrefixes" server.ts
          grep -q "truncate table public.users cascade" database/migrations/phase_3b_fresh_start.sql
      - name: Type check
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Commit validated runtime patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts scripts .github/workflows/phase3-final-stabilization.yml
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "fix: finalize Phase 3 runtime routing [phase3-final]"
            git push origin HEAD:phase-3-final-stabilization
          fi
