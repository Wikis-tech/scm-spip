name: Phase 3C Auth and Apollo Contacts

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: "!contains(github.event.head_commit.message, '[phase3c-applied]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Phase 3C fixes
        run: node scripts/phase3c-fix-auth-contacts.mjs
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Validate critical fixes
        run: |
          set -e
          grep -q "supabase.auth.signUp" src/components/AuthScreen.tsx
          if grep -q "fetch('/api/auth/register-v2'" src/components/AuthScreen.tsx; then echo "Legacy signup route still used"; exit 1; fi
          grep -q "org?.organization_id || org?.id" src/services/apolloService.ts
          grep -q "api/v1/contacts/search" src/services/apolloService.ts
          grep -q "mixed_people/api_search" src/services/apolloService.ts
      - name: Type check
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Commit Phase 3C fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/AuthScreen.tsx src/services/apolloService.ts
          if git diff --cached --quiet; then
            echo "No Phase 3C application changes to commit"
          else
            git commit -m "fix: stabilize signup and Apollo contacts [phase3c-applied]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
