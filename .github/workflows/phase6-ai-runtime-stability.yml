name: Phase 6 AI Runtime Stability
on:
  push:
    branches: [phase-6-ai-runtime-stability]
permissions:
  contents: write
jobs:
  stabilize:
    if: ${{ !contains(github.event.head_commit.message, '[phase6-stable]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-6-ai-runtime-stability
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Apply targeted runtime patch
        run: node scripts/phase6-stateless-fallback.mjs
      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install
      - name: Security assertions
        shell: bash
        run: |
          set -euo pipefail
          grep -q "Do not take Copilot inference offline just because history persistence is unavailable" src/server/phase6AiRuntime.ts
          grep -q "PHASE6 CONVERSATION PERSISTENCE" src/server/phase6AiRuntime.ts
          ! grep -R "VITE_GROQ_API_KEY\|VITE_CEREBRAS_API_KEY\|VITE_OPENROUTER_API_KEY\|VITE_CLOUDFLARE_API_TOKEN" -n src api
          grep -q "eq('user_id', identity.id)" src/server/phase6AiRuntime.ts
      - name: TypeScript
        run: bunx tsc --noEmit
      - name: Production build
        run: bun run build
      - name: Commit stabilized runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server/phase6AiRuntime.ts
          if ! git diff --cached --quiet; then
            git commit -m "fix(phase6): keep Copilot online when history persistence fails [phase6-stable]"
            git push origin HEAD:phase-6-ai-runtime-stability
          fi
