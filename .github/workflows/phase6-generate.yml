name: Phase 6 Generate Integration

on:
  push:
    branches: [phase-6-ai-orchestration]
    paths: ['.github/workflows/phase6-generate.yml']

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-6-ai-orchestration
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: node scripts/phase6-complete.mjs
      - run: bun install
      - name: Commit generated integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server/phase6AiRuntime.ts src/App.tsx src/components/Sidebar.tsx src/pages/Workspaces.tsx .env.example package.json bun.lock
          if ! git diff --cached --quiet; then
            git commit -m "feat: materialize Phase 6 Copilot integration [phase6-generated]"
            git push origin HEAD:phase-6-ai-orchestration
          fi
