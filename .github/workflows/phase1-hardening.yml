name: Phase 1 Security Hardening

on:
  push:
    branches:
      - phase-1-supabase-auth
    paths:
      - 'scripts/phase1-transform.mjs'
      - '.github/workflows/phase1-hardening.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden-and-validate:
    if: ${{ !contains(github.event.head_commit.message || '', '[phase1-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: phase-1-supabase-auth
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply deterministic hardening transform
        run: node scripts/phase1-transform.mjs

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Type check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit generated hardening changes
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts src/db/schema.ts
          git commit -m "security: apply Supabase auth hardening [phase1-generated]"
          git push origin HEAD:phase-1-supabase-auth
