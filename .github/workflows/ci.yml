name: SPIP CI

on:
  push:
    branches: [main, phase-1-supabase-auth]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare dependency graph
        run: npm install --package-lock-only --ignore-scripts
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Security and functional assertions
        run: |
          set -e
          if grep -R -n --exclude-dir=node_modules --exclude='*.md' "scmcapital2026" src server.ts api 2>/dev/null; then echo "Legacy default password remains"; exit 1; fi
          if grep -R -n --exclude-dir=node_modules --exclude='*.md' "KpuBuIUPuGIKOatjdoiVeA" src server.ts api 2>/dev/null; then echo "Committed Apollo fallback remains"; exit 1; fi
          if grep -R -n --exclude-dir=node_modules --exclude='*.md' "VITE_APOLLO_API_KEY" src server.ts api 2>/dev/null; then echo "Apollo secret exposed through a client-style environment variable"; exit 1; fi
          if grep -q "password: text('password')" src/db/schema.ts; then echo "Plaintext password column remains"; exit 1; fi
          if grep -R -n --exclude-dir=node_modules --exclude='*.md' "x-user-role\|x-user-id\|x-user-email" src 2>/dev/null; then echo "Legacy browser-controlled identity headers remain in frontend code"; exit 1; fi
          grep -q "fetch('/api/auth/register-v2'" src/components/AuthScreen.tsx
          grep -q "auth.admin.createUser" src/server/publicAuthRoutes.ts
          grep -q "permission_level: 'STAFF'" src/server/publicAuthRoutes.ts
          grep -q "status: 'PENDING'" src/server/publicAuthRoutes.ts
          grep -q "MAX_ATTEMPTS" src/server/publicAuthRoutes.ts
          grep -q "password.length < 12" src/components/AuthScreen.tsx
          grep -q "permission_level" database/migrations/phase_2c_signup_reliability.sql
          grep -q "truncate table public.users cascade" database/migrations/phase_3b_fresh_start.sql
          grep -q "mixed_companies/search" src/services/apolloService.ts
          grep -q "accounts/search" src/services/apolloService.ts
          grep -q "mixed_people/api_search" src/services/apolloService.ts
      - name: Type check
        run: npm run lint
      - name: Build
        run: npm run build
