name: SPIP CI

on:
  push:
    branches: [main, phase-1-supabase-auth]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Security assertions
        run: |
          if grep -q "scmcapital2026" server.ts; then echo "Legacy default password remains"; exit 1; fi
          if grep -q "VITE_APOLLO_API_KEY" server.ts src/services/apolloService.ts; then echo "Apollo secret exposed through client-style env"; exit 1; fi
          if grep -q "KpuBuIUPuGIKOatjdoiVeA" server.ts src/services/apolloService.ts; then echo "Committed Apollo fallback remains"; exit 1; fi
          if grep -q "password: text('password')" src/db/schema.ts; then echo "Plaintext password column remains"; exit 1; fi
      - name: Type check
        run: npm run lint
      - name: Build
        run: npm run build
