name: Phase 6 PPT Bundle Runtime

on:
  push:
    branches: [phase-6-ppt-bundle-runtime]
    paths: ['.github/workflows/phase6-ppt-bundle-runtime.yml']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-6-ppt-bundle-runtime
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Isolate PowerPoint dependency and use bundled build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/server/phase6ArtifactRuntime.ts')
          s=p.read_text()
          s=s.replace("import { createRequire } from 'node:module';\n", "import { createRequire } from 'node:module';\nimport path from 'node:path';\n")
          s=s.replace("\nconst nodeRequire = createRequire(import.meta.url);\nconst pptxModule = nodeRequire('@lofcz/pptxgenjs');\nconst PptxGenJS: any = pptxModule.default || pptxModule;\n", "\nconst nodeRequire = createRequire(import.meta.url);\n")
          old="""async function renderPptx(title: string, content: string) {\n  const pptx = new PptxGenJS();"""
          new="""async function renderPptx(title: string, content: string) {\n  // Load the browser bundle only when PPTX is requested. The bundle includes its ZIP\n  // runtime and avoids Vercel's mixed ESM/CommonJS dependency loader conflict.\n  const packageEntry = nodeRequire.resolve('@lofcz/pptxgenjs');\n  const bundlePath = path.join(path.dirname(packageEntry), 'pptxgen.bundle.js');\n  const pptxModule = nodeRequire(bundlePath);\n  const PptxGenJS: any = pptxModule.default || pptxModule.PptxGenJS || pptxModule;\n  const pptx = new PptxGenJS();"""
          if old not in s: raise SystemExit('renderPptx marker not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Validate build
        run: |
          bun install --frozen-lockfile
          bunx tsc --noEmit
          bun run build
      - name: Commit runtime fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server/phase6ArtifactRuntime.ts
          if ! git diff --cached --quiet; then
            git commit -m "fix(phase6): isolate PPT generator using bundled runtime"
            git push origin HEAD:phase-6-ppt-bundle-runtime
          fi
