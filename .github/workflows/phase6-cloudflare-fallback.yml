name: Phase 6 Cloudflare Fallback

on:
  push:
    branches: [phase-6-cloudflare-fallback]
    paths: ['.github/workflows/phase6-cloudflare-fallback.yml']

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-6-cloudflare-fallback
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Add Cloudflare Workers AI provider
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/server/phase6AiRuntime.ts')
          s=p.read_text()
          old="""    openrouter: { id: 'openrouter', label: 'OpenRouter', endpoint: 'https://openrouter.ai/api/v1/chat/completions', apiKey: process.env.OPENROUTER_API_KEY?.trim(), model: process.env.OPENROUTER_MODEL?.trim() || 'openrouter/free', confidentialAllowed: false, priority: 30 },\n    deepseek: { id: 'deepseek', label: 'DeepSeek', endpoint: 'https://api.deepseek.com/chat/completions', apiKey: process.env.DEEPSEEK_API_KEY?.trim(), model: process.env.DEEPSEEK_MODEL?.trim() || 'deepseek-chat', confidentialAllowed: process.env.DEEPSEEK_CONFIDENTIAL_ALLOWED === 'true', priority: 40 },\n    zai: { id: 'zai', label: 'Z.ai', endpoint: 'https://api.z.ai/api/paas/v4/chat/completions', apiKey: process.env.ZAI_API_KEY?.trim(), model: process.env.ZAI_MODEL?.trim() || 'glm-4.7-flash', confidentialAllowed: process.env.ZAI_CONFIDENTIAL_ALLOWED === 'true', priority: 50 },"""
          new="""    openrouter: { id: 'openrouter', label: 'OpenRouter', endpoint: 'https://openrouter.ai/api/v1/chat/completions', apiKey: process.env.OPENROUTER_API_KEY?.trim(), model: process.env.OPENROUTER_MODEL?.trim() || 'openrouter/free', confidentialAllowed: process.env.OPENROUTER_CONFIDENTIAL_ALLOWED === 'true', priority: 30 },\n    cloudflare: { id: 'cloudflare', label: 'Cloudflare Workers AI', endpoint: process.env.CLOUDFLARE_ACCOUNT_ID?.trim() ? `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID.trim()}/ai/v1/chat/completions` : '', apiKey: process.env.CLOUDFLARE_ACCOUNT_ID?.trim() ? process.env.CLOUDFLARE_API_TOKEN?.trim() : undefined, model: process.env.CLOUDFLARE_MODEL?.trim() || '@cf/openai/gpt-oss-120b', confidentialAllowed: process.env.CLOUDFLARE_CONFIDENTIAL_ALLOWED === 'true', priority: 40 },\n    deepseek: { id: 'deepseek', label: 'DeepSeek', endpoint: 'https://api.deepseek.com/chat/completions', apiKey: process.env.DEEPSEEK_API_KEY?.trim(), model: process.env.DEEPSEEK_MODEL?.trim() || 'deepseek-chat', confidentialAllowed: process.env.DEEPSEEK_CONFIDENTIAL_ALLOWED === 'true', priority: 50 },\n    zai: { id: 'zai', label: 'Z.ai', endpoint: 'https://api.z.ai/api/paas/v4/chat/completions', apiKey: process.env.ZAI_API_KEY?.trim(), model: process.env.ZAI_MODEL?.trim() || 'glm-4.7-flash', confidentialAllowed: process.env.ZAI_CONFIDENTIAL_ALLOWED === 'true', priority: 60 },"""
          if old not in s: raise SystemExit('provider registry target not found')
          s=s.replace(old,new)
          s=s.replace("process.env.AI_PROVIDER_ORDER || 'groq,cerebras,openrouter,deepseek,zai'", "process.env.AI_PROVIDER_ORDER || 'groq,cerebras,openrouter,cloudflare,deepseek,zai'")
          p.write_text(s)

          env=Path('.env.example')
          e=env.read_text()
          oldenv="""OPENROUTER_API_KEY=\nOPENROUTER_MODEL=openrouter/free\n\nAI_PROVIDER_TIMEOUT_MS=45000"""
          newenv="""OPENROUTER_API_KEY=\nOPENROUTER_MODEL=openrouter/free\nOPENROUTER_CONFIDENTIAL_ALLOWED=false\n\n# Independent optional fallback using Cloudflare's OpenAI-compatible Workers AI endpoint.\nCLOUDFLARE_ACCOUNT_ID=\nCLOUDFLARE_API_TOKEN=\nCLOUDFLARE_MODEL=@cf/openai/gpt-oss-120b\nCLOUDFLARE_CONFIDENTIAL_ALLOWED=false\n\n# Recommended order: primary, independent fallback, overflow/router fallback.\nAI_PROVIDER_ORDER=groq,cerebras,cloudflare,openrouter,deepseek,zai\nAI_PROVIDER_TIMEOUT_MS=45000"""
          if oldenv not in e: raise SystemExit('env target not found')
          env.write_text(e.replace(oldenv,newenv))
          PY
      - name: Validate Phase 6 router
        run: |
          bun install --frozen-lockfile
          bunx tsc --noEmit
          bun run build
      - name: Commit integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server/phase6AiRuntime.ts .env.example
          if ! git diff --cached --quiet; then
            git commit -m "feat(phase6): add Cloudflare Workers AI fallback"
            git push origin HEAD:phase-6-cloudflare-fallback
          fi
