name: Phase 1 Runtime Fix

on:
  push:
    branches: [phase-1-supabase-auth]

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: "!contains(github.event.head_commit.message, '[phase1-runtime-fixed]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-1-supabase-auth
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply runtime hardening
        run: node scripts/phase1-runtime-fix.mjs
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Runtime security assertions
        run: |
          if grep -R "x-user-id\|x-user-role\|x-user-email" src/App.tsx src/services/pushService.ts; then echo "Trusted identity headers remain in client code"; exit 1; fi
          if grep -q "scm_auth_user" src/App.tsx; then echo "Legacy localStorage auth profile remains"; exit 1; fi
          if grep -q "mock_db\|resilient memory fallback" src/db/index.ts; then echo "Database memory fallback remains"; exit 1; fi
          if ! grep -q "Authorization.*Bearer" src/App.tsx; then echo "Authenticated bearer API wrapper missing"; exit 1; fi
      - name: Type check
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Commit runtime hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/services/pushService.ts src/db/index.ts server.ts
          if git diff --cached --quiet; then
            echo "No runtime changes to commit"
          else
            git commit -m "security: finalize runtime auth enforcement [phase1-runtime-fixed]"
            git push origin HEAD:phase-1-supabase-auth
          fi
