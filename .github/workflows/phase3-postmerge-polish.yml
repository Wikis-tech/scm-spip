name: Phase 3 Post-Merge Polish

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  polish-and-validate:
    if: "!contains(github.event.head_commit.message, '[phase3-polish]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply production Research integrity polish
        run: node scripts/phase3-postmerge-polish.mjs
      - name: Prepare dependency graph
        run: npm install --package-lock-only --ignore-scripts
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Phase 3 production assertions
        run: |
          set -e
          grep -q "import.meta.env.DEV && showDiag" src/pages/Intelligence.tsx
          grep -q "companyId: company.id, domain: company.domain" src/pages/Intelligence.tsx
          if grep -q "250000000\|1500000000\|5000000000" src/pages/Intelligence.tsx; then echo "Fabricated opportunity values remain"; exit 1; fi
          if grep -q "Lagos, Nigeria\|Energy & Services" src/pages/Intelligence.tsx; then echo "Fabricated executive fallbacks remain"; exit 1; fi
          grep -q "setIsImported(false)" src/pages/Intelligence.tsx
          grep -q "fetch('/api/auth/register-v2'" src/components/AuthScreen.tsx
          grep -q "accounts/search" src/services/apolloService.ts
          grep -q "truncate table public.users cascade" database/migrations/phase_3b_fresh_start.sql
      - name: Type check
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Commit production polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Intelligence.tsx
          if git diff --cached --quiet; then
            echo "No production polish changes to commit"
          else
            git commit -m "fix: polish Phase 3 production Research integrity [phase3-polish]"
            git push origin HEAD:main
          fi
