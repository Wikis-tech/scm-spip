name: Phase 1 Finalize

on:
  push:
    branches: [phase-1-supabase-auth]
    paths:
      - 'scripts/phase1-finalize.mjs'
      - '.github/workflows/phase1-finalize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message || '', '[phase1-finalized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-1-supabase-auth
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Finalize session handling
        run: node scripts/phase1-finalize.mjs
      - name: Remove one-time migration automation
        run: |
          rm -f scripts/phase1-transform.mjs
          rm -f scripts/phase1-post-transform.mjs
          rm -f scripts/phase1-finalize.mjs
          rm -f .github/workflows/phase1-hardening.yml
          rm -f .github/workflows/phase1-finalize.yml
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Type check
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Commit final Phase 1 code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "security: finalize Supabase sessions [phase1-finalized]"
          git push origin HEAD:phase-1-supabase-auth
